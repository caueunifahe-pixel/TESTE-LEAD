<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking - UNIFAHE Leads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="shellHeader">
    <div class="logoBlock">
      <img src="logoLight.png" class="logoImage relative z-10 opacity-0 shadow-black/5 data-[loaded=true]:opacity-100 shadow-none transition-transform-opacity motion-reduce:transition-none !duration-300 rounded-none mx-auto h-auto w-28 min-w-28 select-none object-cover 2xl:w-44" sizes="100vw" alt="Unifahe" height="0" width="0" draggable="false" data-loaded="true">
    </div>

    <nav class="mainNav noPrint">
      <a class="softLink" href="index.html">Voltar ao painel</a>
      <button class="primary" id="exportRankingPdf">Salvar PDF</button>
    </nav>
  </header>

  <section class="hero rankingHero">
    <div class="heroPattern heroPatternA"></div>
    <div class="heroPattern heroPatternB"></div>
    <div class="heroStrip"></div>

    <div class="heroInner">
      <div class="pill"><span></span> RANKING · UNIFAHE</div>
      <h1 id="rankingTitle">Ranking</h1>
      <p id="rankingSubtitle">Classificação por vendedor com campanhas relacionadas.</p>
    </div>
  </section>

  <main class="app">
    <section class="metrics" id="rankingMetrics"></section>

    <section class="panel">
      <div class="panelHead">
        <div>
          <h2 id="rankingPanelTitle">Ranking</h2>
          <p>Lista compacta por vendedor, campanha e leads vinculados.</p>
        </div>
      </div>
      <div class="tableWrap">
        <table class="rankTable">
          <thead>
            <tr>
              <th>Posição</th>
              <th>Vendedor</th>
              <th>Total</th>
              <th>Campanhas / frases</th>
              <th>Leads vinculados</th>
            </tr>
          </thead>
          <tbody id="rankingRows"></tbody>
        </table>
        <div class="empty" id="emptyRanking" hidden>Nenhum registro encontrado para este ranking.</div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="ranking.js"></script>
</body>
</html>
